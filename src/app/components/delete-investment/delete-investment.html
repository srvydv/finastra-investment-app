<div class="main-container">
  <div class="find-card">
    <h3>Find And Delete investment</h3>
    <div class="form-row row">
      <div class="col-md-3">
        <mat-form-field class="example-full-width" appearance="outline">
          <mat-label>Investment ID:</mat-label>
          <input
            matInput
            type="number"
            id="investmentId"
            [value]="id()"
            (input)="onIdInput($event)"
            placeholder="Enter Investment ID"
          />
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <button
          (click)="findInvestment()"
          [disabled]="id() === null"
          type="button"
          matButton="filled"
          class="find-btn"
        >
          Find Investment
        </button>
      </div>
    </div>
  </div>
  @if (loading()) {
  <div class="info">Loading...</div>
  } @if (error()) {
  <div class="error">{{ error() }}</div>
  } @if (investment()) {
  <div class="result">
    <h3>
      {{ investment()!.name }}
      <button type="button" matButton="filled" (click)="deleteInvestment()">
        Delete Investment
      </button>
    </h3>
    <ul>
      @for (field of fields(); track field.label) {
      <li>
        <strong class="label">{{ field.label }}:</strong>{{ field.value }}
      </li>
      }
    </ul>
  </div>
  } @else {
  <div class="muted">Enter an ID to view the investment</div>
  }
</div>
